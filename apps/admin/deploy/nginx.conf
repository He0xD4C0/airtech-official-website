map "$uri:$status" $admin_cache_control {
    default "no-store";
    ~^/assets/.*:200$ "public, max-age=31536000, immutable";
}

server {
    listen 3100;
    server_name _;
    root /usr/share/nginx/html;

    add_header Cache-Control $admin_cache_control always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: ${ADMIN_MEDIA_IMAGE_SOURCES}; font-src 'self' data:; connect-src 'self' ${ADMIN_API_ORIGIN}; worker-src 'none'; manifest-src 'none'" always;

    location = /robots.txt {
        try_files $uri =404;
    }

    location ~* ^/sitemap(?:-[^/]+)?\.xml$ {
        return 404;
    }

    location ~* ^/(?:site\.webmanifest|manifest(?:\.webmanifest|\.json)|browserconfig\.xml|favicon(?:-[^/]*)?\.(?:ico|png|svg)|apple-touch-icon(?:-[^/]*)?\.png)$ {
        return 404;
    }

    location ~* ^/(?:google[^/]+\.html|bingsiteauth\.xml|baidu_verify[^/]*\.html|yandex_[^/]+\.html)$ {
        return 404;
    }

    location ^~ /.vite/ {
        return 404;
    }

    location ~* ^/en(?:/|$) {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
