[workspace]
resolver = "2"
members = [
  "crates/domain",
  "crates/runtime",
  "crates/http",
  "crates/jobs",
  "apps/api",
  "apps/worker",
  "apps/maintenance",
  "tests/contracts",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[workspace.dependencies]
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["http2", "json", "macros", "multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
data-encoding = "2"
dotenvy = "0.15"
futures-util = "0.3"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.6"
portable-pty = { version = "0.9" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ring = "0.17"
roxmltree = "=0.20.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "postgres", "runtime-tokio-rustls", "uuid"] }
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
totp-rs = { version = "=5.7.2", features = ["otpauth", "zeroize"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "request-id", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
webp = "0.3"
webpki-roots = "1"
zeroize = "1.8"
http-body-util = "0.1"
airtek-domain = { path = "crates/domain" }
airtek-runtime = { path = "crates/runtime" }
airtek-http = { path = "crates/http" }
airtek-jobs = { path = "crates/jobs" }
