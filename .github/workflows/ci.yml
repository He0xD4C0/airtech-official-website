name: CI

on:
  push:
    tags:
      - 'dev-arm64-*'
      - 'release-x86-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    outputs:
      image_prefix: ${{ steps.release.outputs.image_prefix }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      tag_prefix: ${{ steps.release.outputs.tag_prefix }}
      target_platform: ${{ steps.release.outputs.target_platform }}
      runner: ${{ steps.release.outputs.runner }}
      image_suffix: ${{ steps.release.outputs.image_suffix }}
    steps:
      - id: release
        name: Resolve the release tag, platform and runner
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          CONFIGURED_IMAGE_PREFIX: ${{ vars.AIRTEK_IMAGE_PREFIX }}
          CONFIGURED_ARM64_RUNNER: ${{ vars.AIRTEK_ARM64_RUNNER }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^(dev-arm64|release-x86)-[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$'; then
            echo "Release tags must match dev-arm64-* or release-x86-* and stay OCI-safe." >&2
            exit 1
          fi
          owner=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          prefix=${CONFIGURED_IMAGE_PREFIX:-ghcr.io/$owner/airtekpower}
          case "$RELEASE_TAG" in
            dev-arm64-*)
              platform=linux/arm64
              tag_prefix=dev-arm64-
              runner=${CONFIGURED_ARM64_RUNNER:-ubuntu-24.04-arm}
              suffix=-dev
              ;;
            *)
              platform=linux/amd64
              tag_prefix=release-x86-
              runner=ubuntu-latest
              suffix=
              ;;
          esac
          {
            echo "release_tag=$RELEASE_TAG"
            echo "image_prefix=$prefix"
            echo "tag_prefix=$tag_prefix"
            echo "target_platform=$platform"
            echo "runner=$runner"
            echo "image_suffix=$suffix"
          } >> "$GITHUB_OUTPUT"

  object-storage-images:
    needs:
      - release-metadata
    runs-on: ${{ needs.release-metadata.outputs.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: minio
            dockerfile: infra/docker/Dockerfile.minio
          - image: minio-mc
            dockerfile: infra/docker/Dockerfile.mc
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Refuse to overwrite an already published release image
        env:
          IMAGE: ${{ needs.release-metadata.outputs.image_prefix }}-${{ matrix.image }}${{ needs.release-metadata.outputs.image_suffix }}:${{ needs.release-metadata.outputs.release_tag }}
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Refusing to overwrite the published image $IMAGE; a release tag is immutable." >&2
            exit 1
          fi
      - id: publish
        name: Build and publish ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ needs.release-metadata.outputs.target_platform }}
          push: true
          tags: ${{ needs.release-metadata.outputs.image_prefix }}-${{ matrix.image }}${{ needs.release-metadata.outputs.image_suffix }}:${{ needs.release-metadata.outputs.release_tag }}
          build-args: |
            GOPROXY=${{ vars.AIRTEK_GOPROXY || 'https://proxy.golang.org,direct' }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ needs.release-metadata.outputs.target_platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ needs.release-metadata.outputs.target_platform }}
      - name: Record the immutable image digest
        env:
          IMAGE: ${{ needs.release-metadata.outputs.image_prefix }}-${{ matrix.image }}${{ needs.release-metadata.outputs.image_suffix }}:${{ needs.release-metadata.outputs.release_tag }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          printf '### `%s`\n\nDigest: `%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  rust-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/platform
      - name: Compile the production platform at its declared MSRV
        working-directory: services/platform
        run: cargo check --locked --workspace --all-targets --features production

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/platform
      - run: pnpm install --frozen-lockfile
      - name: Check production OpenAPI snapshot and generated TypeScript
        run: pnpm check:contracts

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test and enforce source line limits
        run: pnpm test:source-lines && pnpm check:architecture
      - name: Build generated TypeScript contract package
        run: pnpm --filter @airtek/contracts build
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Run frontend and public API contract tests
        run: pnpm test
      - run: pnpm check:production
      - run: pnpm check:deployment
      - run: pnpm check:media-boundary

  browser-contracts:
    needs:
      - release-metadata
      - object-storage-images
    permissions:
      contents: read
      packages: read
    runs-on: ${{ needs.release-metadata.outputs.runner }}
    timeout-minutes: 35
    env:
      E2E_PUBLIC_ORIGIN: http://www.airtek.test:8088
      E2E_ADMIN_ORIGIN: http://admin.airtek.test:8088
      E2E_API_ORIGIN: http://api.airtek.test:8088
      AIRTEK_OBJECT_STORE_IMAGE: ${{ needs.release-metadata.outputs.image_prefix }}-minio${{ needs.release-metadata.outputs.image_suffix }}:${{ needs.release-metadata.outputs.release_tag }}
      AIRTEK_OBJECT_STORE_MC_IMAGE: ${{ needs.release-metadata.outputs.image_prefix }}-minio-mc${{ needs.release-metadata.outputs.image_suffix }}:${{ needs.release-metadata.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR for the private object-storage images
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Generate independent ephemeral CI-only platform keys
        run: |
          echo "AIRTEK_TOTP_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "AIRTEK_PREVIEW_SIGNING_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "AIRTEK_PRODUCT_STAGING_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "AIRTEK_ANALYTICS_TOKEN_HMAC_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "AIRTEK_INVITATION_REPLAY_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Install the Playwright Chromium runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Run SSR, origin-isolation, Admin workflows, and axe contracts through the gateway
        run: pnpm test:e2e:stack
      - name: Upload Playwright diagnostics after a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-browser-contracts
          include-hidden-files: true
          path: |
            .local/qa/playwright-report/
            .local/qa/test-results/
            !.local/qa/test-results/**/e2e-admin-*.json
            !.local/qa/test-results/**/e2e-admin-totp-secret.txt
          if-no-files-found: ignore
          retention-days: 7

  rust:
    needs:
      - release-metadata
      - object-storage-images
    permissions:
      contents: read
      packages: read
    runs-on: ${{ needs.release-metadata.outputs.runner }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: airtek
          POSTGRES_USER: airtek
          POSTGRES_PASSWORD: airtek
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U airtek -d airtek"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://airtek:airtek@127.0.0.1:5432/airtek
      AIRTEK_TEST_DATABASE_URL: postgres://airtek:airtek@127.0.0.1:5432/airtek_test_contracts
      AIRTEK_TEST_TEMPLATE_DATABASE: airtek_test_template
      FLYWAY_URL: jdbc:postgresql://127.0.0.1:5432/airtek
      FLYWAY_USER: airtek
      FLYWAY_PASSWORD: airtek
      FLYWAY_PLACEHOLDERS_RUNTIME_ROLE: airtek_runtime
      AIRTEK_FLYWAY_TARGET: 31
      AIRTEK_OBJECT_STORE_IMAGE: ${{ needs.release-metadata.outputs.image_prefix }}-minio${{ needs.release-metadata.outputs.image_suffix }}:${{ needs.release-metadata.outputs.release_tag }}
      AIRTEK_OBJECT_STORE_MC_IMAGE: ${{ needs.release-metadata.outputs.image_prefix }}-minio-mc${{ needs.release-metadata.outputs.image_suffix }}:${{ needs.release-metadata.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR for the private object-storage images
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Generate a temporary CI-only runtime database password
        run: |
          runtime_password="$(openssl rand -hex 32)"
          echo "::add-mask::${runtime_password}"
          echo "AIRTEK_RUNTIME_DATABASE_PASSWORD=${runtime_password}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/platform
      - run: cargo fmt --manifest-path services/platform/Cargo.toml --all -- --check
      - run: node scripts/checks/assert-postgres-runtime-boundary.mjs
      - run: cargo clippy --manifest-path services/platform/Cargo.toml --workspace --all-targets --features production -- -D warnings
      - name: Provision a distinct runtime database role
        run: |
          docker exec -i "${{ job.services.postgres.id }}" \
            psql --username airtek --dbname postgres \
            --set ON_ERROR_STOP=1 \
            --set "runtime_password=${AIRTEK_RUNTIME_DATABASE_PASSWORD}" <<'SQL'
          CREATE ROLE airtek_runtime LOGIN PASSWORD :'runtime_password';
          SQL
      - name: Build the non-root Flyway migrations image
        run: docker build --file infra/docker/Dockerfile.flyway --tag airtek-flyway:ci .
      - name: Apply Flyway migrations twice and validate history
        run: |
          docker run --rm --network host -e FLYWAY_URL -e FLYWAY_USER -e FLYWAY_PASSWORD -e FLYWAY_PLACEHOLDERS_RUNTIME_ROLE -e AIRTEK_FLYWAY_TARGET airtek-flyway:ci migrate
          docker exec ${{ job.services.postgres.id }} psql --username airtek --dbname airtek --set ON_ERROR_STOP=1 --command "CREATE SEQUENCE public.ci_runtime_grant_sequence"
          docker run --rm --network host -e FLYWAY_URL -e FLYWAY_USER -e FLYWAY_PASSWORD -e FLYWAY_PLACEHOLDERS_RUNTIME_ROLE -e AIRTEK_FLYWAY_TARGET airtek-flyway:ci migrate
          docker run --rm --network host -e FLYWAY_URL -e FLYWAY_USER -e FLYWAY_PASSWORD -e FLYWAY_PLACEHOLDERS_RUNTIME_ROLE -e AIRTEK_FLYWAY_TARGET airtek-flyway:ci validate
          docker exec ${{ job.services.postgres.id }} psql --username airtek --dbname airtek --set ON_ERROR_STOP=1 --command "DO \$\$ BEGIN IF NOT has_table_privilege('airtek_runtime', 'public.content_entries', 'SELECT') OR NOT has_sequence_privilege('airtek_runtime', 'public.ci_runtime_grant_sequence', 'USAGE') OR NOT has_database_privilege('airtek_runtime', current_database(), 'TEMPORARY') OR NOT has_table_privilege('airtek_runtime', 'public.flyway_schema_history', 'SELECT') OR has_table_privilege('airtek_runtime', 'public.flyway_schema_history', 'INSERT') OR has_table_privilege('airtek_runtime', 'public.flyway_schema_history', 'TRUNCATE') OR NOT has_schema_privilege('airtek_runtime', 'public', 'USAGE') OR has_schema_privilege('airtek_runtime', 'public', 'CREATE') THEN RAISE EXCEPTION 'runtime role boundary is invalid'; END IF; END \$\$"
          docker exec \
            -e "PGPASSWORD=${AIRTEK_RUNTIME_DATABASE_PASSWORD}" \
            "${{ job.services.postgres.id }}" \
            psql --host 127.0.0.1 --username airtek_runtime --dbname airtek \
            --no-password --set ON_ERROR_STOP=1 --command "SELECT 1"
      - name: Prepare runtime data and create the isolated test template
        run: |
          cargo run --manifest-path services/platform/Cargo.toml -p airtek-maintenance --bin airtek-maintenance -- prepare-runtime
          docker exec "${{ job.services.postgres.id }}" \
            psql --username airtek --dbname postgres --set ON_ERROR_STOP=1 \
            --command "CREATE DATABASE airtek_test_template TEMPLATE airtek"
          docker exec "${{ job.services.postgres.id }}" \
            psql --username airtek --dbname postgres --set ON_ERROR_STOP=1 \
            --command "CREATE DATABASE airtek_test_contracts TEMPLATE airtek_test_template"
      - name: Exercise guarded legacy SQLx history adoption
        run: |
          set -euo pipefail

          run_psql() {
            local database="$1"
            shift
            docker run --rm -i --network host \
              -e "PGPASSWORD=${FLYWAY_PASSWORD}" \
              postgres:17-alpine \
              psql --host 127.0.0.1 --username "${FLYWAY_USER}" --dbname "${database}" \
              --set ON_ERROR_STOP=1 "$@"
          }

          run_flyway() {
            local database="$1"
            shift
            docker run --rm --network host \
              -e "FLYWAY_URL=jdbc:postgresql://127.0.0.1:5432/${database}" \
              -e FLYWAY_USER \
              -e FLYWAY_PASSWORD \
              -e FLYWAY_PLACEHOLDERS_RUNTIME_ROLE \
              -e AIRTEK_FLYWAY_TARGET \
              airtek-flyway:ci "$@"
          }

          run_psql postgres <<'SQL'
          CREATE DATABASE airtek_sqlx_adoption;
          SQL

          run_psql airtek_sqlx_adoption <<'SQL'
          CREATE TABLE public._sqlx_migrations (
              version bigint PRIMARY KEY,
              description text NOT NULL,
              installed_on timestamptz NOT NULL DEFAULT now(),
              success boolean NOT NULL,
              checksum bytea NOT NULL,
              execution_time bigint NOT NULL
          );
          SQL

          for migration in \
            services/platform/migrations/V000{1..9}__*.sql \
            services/platform/migrations/V0010__*.sql; do
            run_psql airtek_sqlx_adoption < "${migration}"
          done

          run_psql airtek_sqlx_adoption <<'SQL'
          INSERT INTO public._sqlx_migrations
              (version, description, success, checksum, execution_time)
          VALUES
              (1, 'platform foundation', true, decode('ccd98441f2636df4e875f67bff11a6d5f984a058380810e1be1884c00057717076f04da1f959599dd67f5757a2930564', 'hex'), 0),
              (2, 'operational hardening', true, decode('84a0652742c1e94b5c50ab5295d5e7f93bac2686f43ad78d72c6c48ff4b2c2eda40efd602a5963a4d6c1ce10789574f7', 'hex'), 0),
              (3, 'content lifecycle fields', true, decode('1a0867c93e79f58192065c4fdee997988626fe8879f953731e53fa0ee9c498605770d7c09807b153de89c6c31d14f56a', 'hex'), 0),
              (4, 'operational recovery and erasure', true, decode('b87cab34cfe88e98663e8d1e01dd7fee2424c8efb2b45e392258b0d3fa80cb2f1a55ff9704607ad87bd91c68da8c7ee2', 'hex'), 0),
              (5, 'platform capability completion', true, decode('8c4b886f20032b2d1c0f4b5df1c9e373b408e71ed7a5f595c6353e24424c2f4914a3b2373852e52b4e01c8cce8d0a250', 'hex'), 0),
              (6, 'scope completion', true, decode('4a57cee86761d1e06ccdbf824d7347a32dc47c5c8433a636ba24f0e1dd8d38f9c6ccf0985e2c038a8074de47455655cc', 'hex'), 0),
              (7, 'content versioning and previews', true, decode('862d506fbfcccd71e1472ec7f367638ee262772059a3939fc04d786e3e6c4d76961230276d17c74e8446b88a22f1d3cc', 'hex'), 0),
              (8, 'analytics chain and catalog', true, decode('f5e7452eadf8b80a01b8abe6715f0470a66045ff1d61038001dce7f9013d1a6dbfe812511fb808f4d4c220670b09c837', 'hex'), 0),
              (9, 'runtime completion', true, decode('a8f96920cdab8147aaf24ac3db504fb2d49eb4f5dc7a6173f984776fabd8a70f1c72dcd8dc60e8d5c373b64b040917a4', 'hex'), 0),
              (10, 'product source takeover', true, decode('d674ac912444d60d354a96c81114dbe2d877f26eb8d8d5622c902b49a460c333d8b8b113886b96fcd9d48f43e4712ed9', 'hex'), 0);
          SQL

          run_psql postgres <<'SQL'
          CREATE DATABASE airtek_sqlx_bad_checksum TEMPLATE airtek_sqlx_adoption;
          CREATE DATABASE airtek_sqlx_missing_version TEMPLATE airtek_sqlx_adoption;
          SQL

          run_psql airtek_sqlx_bad_checksum <<'SQL'
          UPDATE public._sqlx_migrations
          SET checksum = decode('00', 'hex')
          WHERE version = 10;
          SQL

          run_psql airtek_sqlx_missing_version <<'SQL'
          DELETE FROM public._sqlx_migrations
          WHERE version = 10;
          SQL

          run_flyway airtek_sqlx_adoption baseline
          run_flyway airtek_sqlx_adoption migrate
          run_flyway airtek_sqlx_adoption validate

          run_psql airtek_sqlx_adoption <<'SQL'
          DO $flyway_history$
          BEGIN
              IF (
                  SELECT count(*)
                  FROM public.flyway_schema_history
                  WHERE version = '10'
                    AND type = 'BASELINE'
                    AND success
              ) <> 1 THEN
                  RAISE EXCEPTION
                      'SQLx adoption must create exactly one successful Flyway baseline at version 10';
              END IF;

              IF EXISTS (
                  SELECT 1
                  FROM public.flyway_schema_history
                  WHERE type = 'SQL'
                    AND version::integer BETWEEN 1 AND 10
              ) THEN
                  RAISE EXCEPTION
                      'SQLx adoption must not register or execute V1-V10 as Flyway SQL migrations';
              END IF;
          END
          $flyway_history$;
          SQL

          run_psql postgres <<'SQL'
          CREATE DATABASE airtek_sqlx_post_baseline_tamper TEMPLATE airtek_sqlx_adoption;
          SQL

          run_psql airtek_sqlx_post_baseline_tamper <<'SQL'
          UPDATE public._sqlx_migrations
          SET checksum = decode('00', 'hex')
          WHERE version = 10;
          SQL

          if tamper_output="$(run_flyway airtek_sqlx_post_baseline_tamper migrate 2>&1)"; then
            echo "Flyway unexpectedly accepted SQLx history changed after baseline" >&2
            exit 1
          fi
          case "${tamper_output}" in
            *"Flyway migrate refused: version 10 baseline SQLx evidence"*) ;;
            *)
              echo "Flyway failed after SQLx history tampering, but not through beforeMigrate" >&2
              printf '%s\n' "${tamper_output}" >&2
              exit 1
              ;;
          esac

          for database in airtek_sqlx_bad_checksum airtek_sqlx_missing_version; do
            if run_flyway "${database}" baseline; then
              echo "Flyway unexpectedly accepted invalid SQLx history in ${database}" >&2
              exit 1
            fi
          done
      - name: Run Rust unit and HTTP contract tests
        run: cargo test --manifest-path services/platform/Cargo.toml --workspace
      - name: Run isolated PostgreSQL, MinIO and serialized Product Master contracts
        run: |
          env -u DATABASE_URL -u AIRTEK_TEST_DATABASE_URL -u AIRTEK_DATABASE_URL_INTERNAL -u FLYWAY_URL \
            node scripts/testing/run-postgres-contracts.mjs
      - run: cargo check --manifest-path services/platform/Cargo.toml --workspace --features production
      - run: cargo check --manifest-path services/platform/Cargo.toml --workspace --features devtools
      - name: Assert production and DevTools are mutually exclusive
        run: |
          if cargo check --manifest-path services/platform/Cargo.toml --workspace --features production,devtools; then
            echo "production+devtools unexpectedly compiled"
            exit 1
          fi
      - name: Assert production dependency tree excludes DevTools CLI, PTY, and WebSocket packages
        run: |
          if cargo tree --manifest-path services/platform/Cargo.toml --features production | grep -E '(^| )((clap|portable-pty|tokio-tungstenite|tungstenite) v)'; then
            echo "production dependency tree contains a DevTools CLI, PTY, or WebSocket package"
            exit 1
          fi

  deployment:
    runs-on: ubuntu-latest
    env:
      # Compose interpolates profile-gated services even when the profile is
      # inactive, so the configuration checks need placeholder image references.
      AIRTEK_OBJECT_STORE_IMAGE: ghcr.io/validation-only/airtekpower-minio:validation
      AIRTEK_OBJECT_STORE_MC_IMAGE: ghcr.io/validation-only/airtekpower-minio-mc:validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/checks/assert-deployment-config.mjs
      - run: node scripts/checks/assert-production-infrastructure.mjs
      - name: Validate every supported Compose combination
        run: node scripts/checks/assert-compose-configs.mjs
      - run: node scripts/checks/assert-migration-release-config.mjs
      - run: node scripts/checks/assert-object-storage-build.mjs
      - run: docker compose --project-directory . config --quiet
      - name: Validate opt-in debug port override
        run: docker compose --project-directory . -f compose.yaml -f infra/compose/debug.yaml --profile object-storage config --quiet
      - name: Validate provider-neutral production Compose
        run: docker compose --project-directory . --env-file infra/deploy/production.env.example -f infra/compose/production.app.yaml config --quiet
      - name: Validate independently operated production infrastructure
        run: docker compose --project-directory . --env-file infra/deploy/infrastructure.env.example -f infra/compose/production.infrastructure.yaml --profile bootstrap config --quiet
      - name: Validate production shell scripts
        run: sh -n infra/deploy/deploy-app.sh infra/deploy/postgres-bootstrap.sh
      - name: Validate Admin Nginx template
        run: >-
          docker run --rm
          -e ADMIN_API_ORIGIN=http://api.localhost:8088
          -e ADMIN_MEDIA_IMAGE_SOURCES=https:
          -v "$PWD/apps/admin/deploy/nginx.conf:/etc/nginx/templates/default.conf.template:ro"
          nginx:1.27-alpine nginx -t
      - name: Validate gateway Nginx template
        run: |
          docker build --file infra/docker/Dockerfile.gateway --tag airtek-gateway:ci .
          docker run --rm \
            --add-host public-web:127.0.0.1 \
            --add-host admin-web:127.0.0.1 \
            --add-host platform-api:127.0.0.1 \
            -e PUBLIC_HOST=www.localhost \
            -e ADMIN_HOST=admin.localhost \
            -e API_HOST=api.localhost \
            -e API_BROWSER_ORIGIN=http://api.localhost:8088 \
            airtek-gateway:ci nginx -t

  publish-images:
    if: github.ref_type == 'tag'
    needs:
      - release-metadata
      - rust-msrv
      - contracts
      - frontend
      - browser-contracts
      - rust
      - deployment
    runs-on: ${{ needs.release-metadata.outputs.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: public-web
            dockerfile: infra/docker/Dockerfile.web
          - image: admin-web
            dockerfile: infra/docker/Dockerfile.admin
          - image: platform
            dockerfile: infra/docker/Dockerfile.platform
          - image: migrations
            dockerfile: infra/docker/Dockerfile.flyway
          - image: gateway
            dockerfile: infra/docker/Dockerfile.gateway
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Refuse to overwrite an already published release image
        env:
          IMAGE: ${{ needs.release-metadata.outputs.image_prefix }}-${{ matrix.image }}${{ needs.release-metadata.outputs.image_suffix }}:${{ needs.release-metadata.outputs.release_tag }}
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Refusing to overwrite the published image $IMAGE; a release tag is immutable." >&2
            exit 1
          fi
      - id: publish
        name: Build and publish ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ needs.release-metadata.outputs.target_platform }}
          push: true
          tags: ${{ needs.release-metadata.outputs.image_prefix }}-${{ matrix.image }}${{ needs.release-metadata.outputs.image_suffix }}:${{ needs.release-metadata.outputs.release_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release-metadata.outputs.release_tag }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ needs.release-metadata.outputs.target_platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ needs.release-metadata.outputs.target_platform }}
      - name: Record the immutable image digest
        env:
          IMAGE: ${{ needs.release-metadata.outputs.image_prefix }}-${{ matrix.image }}${{ needs.release-metadata.outputs.image_suffix }}:${{ needs.release-metadata.outputs.release_tag }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          printf '### `%s`\n\nDigest: `%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  prune-images:
    if: github.ref_type == 'tag'
    needs:
      - release-metadata
      - publish-images
      - object-storage-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - public-web
          - admin-web
          - platform
          - migrations
          - gateway
          - minio
          - minio-mc
    steps:
      - uses: actions/checkout@v4
      - name: Keep the five newest release images
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: airtekpower-${{ matrix.image }}${{ needs.release-metadata.outputs.image_suffix }}
          KEEP_RELEASE_VERSIONS: '5'
          RETENTION_TAG_PREFIX: ${{ needs.release-metadata.outputs.tag_prefix }}
        run: bash scripts/maintenance/prune-ghcr-versions.sh
