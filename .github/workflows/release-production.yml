name: Publish and release production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full commit SHA to publish
        required: true
        type: string
      deploy_after_publish:
        description: Deploy the published images to the production server
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
      image_prefix: ${{ steps.release.outputs.image_prefix }}
    steps:
      - id: release
        env:
          REQUESTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if ! printf '%s' "$REQUESTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "A full lowercase Git commit SHA is required." >&2
            exit 1
          fi
          owner=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
          echo "image_prefix=ghcr.io/$owner/airtekpower" >> "$GITHUB_OUTPUT"

  build-images:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: public-web
            dockerfile: infra/docker/Dockerfile.web
          - image: admin-web
            dockerfile: infra/docker/Dockerfile.admin
          - image: platform
            dockerfile: infra/docker/Dockerfile.platform
          - image: migrations
            dockerfile: infra/docker/Dockerfile.flyway
          - image: gateway
            dockerfile: infra/docker/Dockerfile.gateway
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - name: Validate production build variables
        env:
          PUBLIC_ORIGIN: ${{ vars.PRODUCTION_PUBLIC_ORIGIN }}
          ADMIN_ORIGIN: ${{ vars.PRODUCTION_ADMIN_ORIGIN }}
          API_ORIGIN: ${{ vars.PRODUCTION_API_ORIGIN }}
        run: |
          test -n "$PUBLIC_ORIGIN"
          test -n "$ADMIN_ORIGIN"
          test -n "$API_ORIGIN"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ vars.PRODUCTION_CONTAINER_PLATFORM || 'linux/amd64' }}
          push: true
          tags: ${{ needs.prepare.outputs.image_prefix }}-${{ matrix.image }}:${{ needs.prepare.outputs.release_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.release_sha }}
          build-args: |
            VITE_PUBLIC_API_BASE_URL=${{ vars.PRODUCTION_API_ORIGIN }}/api/public/v1
            VITE_PUBLIC_ORIGIN=${{ vars.PRODUCTION_PUBLIC_ORIGIN }}
            VITE_ADMIN_API_BASE_URL=${{ vars.PRODUCTION_API_ORIGIN }}/api/admin/v1
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Record the immutable image
        env:
          IMAGE: ${{ needs.prepare.outputs.image_prefix }}-${{ matrix.image }}:${{ needs.prepare.outputs.release_sha }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          printf '### `%s`\n\nDigest: `%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [prepare, build-images]
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.deploy_after_publish) ||
      (github.event_name == 'workflow_run' && vars.PRODUCTION_RELEASE_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - name: Configure pinned ECS host identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ECS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload the immutable deployment bundle
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          remote="${ECS_USER}@${ECS_HOST}"
          target="/opt/airtek/incoming/${RELEASE_SHA}"
          ssh -p "$ECS_PORT" "$remote" "install -d -m 0750 '$target'"
          scp -P "$ECS_PORT" compose.production.yaml infra/deploy/deploy-app.sh "$remote:$target/"
      - name: Deploy application images without touching stateful services
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          IMAGE_PREFIX: ${{ needs.prepare.outputs.image_prefix }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          remote="${ECS_USER}@${ECS_HOST}"
          target="/opt/airtek/incoming/${RELEASE_SHA}"
          ssh -p "$ECS_PORT" "$remote" \
            "cd '$target' && chmod 0550 deploy-app.sh && ./deploy-app.sh '$RELEASE_SHA' '$IMAGE_PREFIX' ./compose.production.yaml"
      - name: Verify browser-visible HTTPS endpoints
        env:
          PUBLIC_ORIGIN: ${{ vars.PRODUCTION_PUBLIC_ORIGIN }}
          ADMIN_ORIGIN: ${{ vars.PRODUCTION_ADMIN_ORIGIN }}
          API_ORIGIN: ${{ vars.PRODUCTION_API_ORIGIN }}
        run: |
          curl --fail --silent --show-error "$API_ORIGIN/readyz" >/dev/null
          curl --fail --silent --show-error "$PUBLIC_ORIGIN/en" >/dev/null
          curl --fail --silent --show-error "$ADMIN_ORIGIN/robots.txt" >/dev/null
