services:
  platform-maintenance:
    environment:
      AIRTEK_DEV_ADMIN_SEED: !reset null
      AIRTEK_DEV_PUBLIC_SEED: !reset null
  public-web:
    # The production-feature E2E stack publishes its fixtures through Admin
    # after startup. This temporary probe avoids a health-check bootstrap loop;
    # the suite then verifies /en and every agreed public journey explicitly.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
