name: ${AIRTEK_APP_PROJECT_NAME:-airtek-app}

# Provider-neutral production process boundary. The image references and
# browser-visible origins are deliberately mandatory: a release must promote
# immutable, independently versioned Public, Admin, Platform, Migrations and Gateway
# artifacts instead of rebuilding from the production checkout.
services:
  flyway-migrate:
    platform: ${AIRTEK_TARGET_PLATFORM:-}
    image: ${AIRTEK_MIGRATIONS_IMAGE:?set AIRTEK_MIGRATIONS_IMAGE to an immutable image reference}
    command: ["migrate"]
    environment:
      FLYWAY_URL: ${FLYWAY_URL:?set FLYWAY_URL to a JDBC PostgreSQL URL}
      FLYWAY_USER: ${FLYWAY_USER:?set the migration role}
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:?set the migration role password from the secret manager}
      FLYWAY_PLACEHOLDERS_RUNTIME_ROLE: ${FLYWAY_PLACEHOLDERS_RUNTIME_ROLE:?set the existing API and Worker database role}
      AIRTEK_FLYWAY_TARGET: ${AIRTEK_FLYWAY_TARGET:?set AIRTEK_FLYWAY_TARGET=27}
    restart: "no"

  platform-maintenance:
    platform: ${AIRTEK_TARGET_PLATFORM:-}
    image: ${AIRTEK_PLATFORM_IMAGE:?set AIRTEK_PLATFORM_IMAGE to an immutable image reference}
    entrypoint: ["/usr/local/bin/airtek-maintenance"]
    command: ["prepare-runtime"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      RUST_LOG: ${RUST_LOG:-airtek_runtime=info,airtek_http=info,airtek_jobs=info}
    depends_on:
      flyway-migrate:
        condition: service_completed_successfully
    restart: "no"

  platform-api:
    platform: ${AIRTEK_TARGET_PLATFORM:-}
    image: ${AIRTEK_PLATFORM_IMAGE:?set AIRTEK_PLATFORM_IMAGE to an immutable image reference}
    environment:
      AIRTEK_API_HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      AIRTEK_PUBLIC_ORIGIN: ${AIRTEK_PUBLIC_ORIGIN:?set AIRTEK_PUBLIC_ORIGIN}
      AIRTEK_ADMIN_ORIGIN: ${AIRTEK_ADMIN_ORIGIN:?set AIRTEK_ADMIN_ORIGIN}
      AIRTEK_ADMIN_BOOTSTRAP_TOKEN: ${AIRTEK_ADMIN_BOOTSTRAP_TOKEN:-}
      AIRTEK_TOTP_ENCRYPTION_KEY: ${AIRTEK_TOTP_ENCRYPTION_KEY:?set AIRTEK_TOTP_ENCRYPTION_KEY from the secret manager}
      AIRTEK_PRODUCT_STAGING_ENCRYPTION_KEY: ${AIRTEK_PRODUCT_STAGING_ENCRYPTION_KEY:?set AIRTEK_PRODUCT_STAGING_ENCRYPTION_KEY from the secret manager}
      AIRTEK_ANALYTICS_TOKEN_HMAC_KEY: ${AIRTEK_ANALYTICS_TOKEN_HMAC_KEY:?set AIRTEK_ANALYTICS_TOKEN_HMAC_KEY from the secret manager}
      AIRTEK_INVITATION_REPLAY_ENCRYPTION_KEY: ${AIRTEK_INVITATION_REPLAY_ENCRYPTION_KEY:?set AIRTEK_INVITATION_REPLAY_ENCRYPTION_KEY from the secret manager}
      AIRTEK_GUEST_RAW_RETENTION_DAYS: ${AIRTEK_GUEST_RAW_RETENTION_DAYS:-180}
      AIRTEK_GUEST_AGGREGATE_RETENTION_MONTHS: ${AIRTEK_GUEST_AGGREGATE_RETENTION_MONTHS:-24}
      AIRTEK_PRODUCT_IMPORT_MAPPING_VERSION: ${AIRTEK_PRODUCT_IMPORT_MAPPING_VERSION:?set the reviewed Product Master mapping version}
      AIRTEK_APPROVED_PRODUCT_MASTER_SHA256: ${AIRTEK_APPROVED_PRODUCT_MASTER_SHA256:?set the approved Product Master SHA-256}
      AIRTEK_APPROVED_PRODUCT_MASTER_MAPPING_VERSION: ${AIRTEK_APPROVED_PRODUCT_MASTER_MAPPING_VERSION:?set the approved Product Master mapping version}
      AIRTEK_APPROVED_PRODUCT_MASTER_VALID_ROWS: ${AIRTEK_APPROVED_PRODUCT_MASTER_VALID_ROWS:?set the approved Product Master valid-row count}
      AIRTEK_APPROVED_PRODUCT_MASTER_ERROR_ROWS: ${AIRTEK_APPROVED_PRODUCT_MASTER_ERROR_ROWS:?set the approved Product Master error-row count}
      AIRTEK_ANALYTICS_ALLOWED_UTM_SOURCES: ${AIRTEK_ANALYTICS_ALLOWED_UTM_SOURCES:-}
      AIRTEK_ANALYTICS_ALLOWED_UTM_MEDIUMS: ${AIRTEK_ANALYTICS_ALLOWED_UTM_MEDIUMS:-}
      AIRTEK_ANALYTICS_ALLOWED_UTM_CAMPAIGNS: ${AIRTEK_ANALYTICS_ALLOWED_UTM_CAMPAIGNS:-}
      AIRTEK_TRUSTED_PROXY_CIDRS: ${AIRTEK_TRUSTED_PROXY_CIDRS:-172.29.0.10/32}
      RUST_LOG: ${RUST_LOG:-airtek_runtime=info,airtek_http=info,airtek_jobs=info,tower_http=info}
    expose:
      - "8080"
    depends_on:
      platform-maintenance:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  platform-worker:
    platform: ${AIRTEK_TARGET_PLATFORM:-}
    image: ${AIRTEK_PLATFORM_IMAGE:?set AIRTEK_PLATFORM_IMAGE to an immutable image reference}
    entrypoint: ["/usr/local/bin/airtek-worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      AIRTEK_PUBLIC_ORIGIN: ${AIRTEK_PUBLIC_ORIGIN:?set AIRTEK_PUBLIC_ORIGIN}
      AIRTEK_ADMIN_ORIGIN: ${AIRTEK_ADMIN_ORIGIN:?set AIRTEK_ADMIN_ORIGIN}
      AIRTEK_TOTP_ENCRYPTION_KEY: ${AIRTEK_TOTP_ENCRYPTION_KEY:?set AIRTEK_TOTP_ENCRYPTION_KEY from the secret manager}
      AIRTEK_PRODUCT_STAGING_ENCRYPTION_KEY: ${AIRTEK_PRODUCT_STAGING_ENCRYPTION_KEY:?set AIRTEK_PRODUCT_STAGING_ENCRYPTION_KEY from the secret manager}
      AIRTEK_ANALYTICS_TOKEN_HMAC_KEY: ${AIRTEK_ANALYTICS_TOKEN_HMAC_KEY:?set AIRTEK_ANALYTICS_TOKEN_HMAC_KEY from the secret manager}
      AIRTEK_INVITATION_REPLAY_ENCRYPTION_KEY: ${AIRTEK_INVITATION_REPLAY_ENCRYPTION_KEY:?set AIRTEK_INVITATION_REPLAY_ENCRYPTION_KEY from the secret manager}
      AIRTEK_GUEST_RAW_RETENTION_DAYS: ${AIRTEK_GUEST_RAW_RETENTION_DAYS:-180}
      AIRTEK_GUEST_AGGREGATE_RETENTION_MONTHS: ${AIRTEK_GUEST_AGGREGATE_RETENTION_MONTHS:-24}
      AIRTEK_PRODUCT_IMPORT_MAPPING_VERSION: ${AIRTEK_PRODUCT_IMPORT_MAPPING_VERSION:?set the reviewed Product Master mapping version}
      AIRTEK_APPROVED_PRODUCT_MASTER_SHA256: ${AIRTEK_APPROVED_PRODUCT_MASTER_SHA256:?set the approved Product Master SHA-256}
      AIRTEK_APPROVED_PRODUCT_MASTER_MAPPING_VERSION: ${AIRTEK_APPROVED_PRODUCT_MASTER_MAPPING_VERSION:?set the approved Product Master mapping version}
      AIRTEK_APPROVED_PRODUCT_MASTER_VALID_ROWS: ${AIRTEK_APPROVED_PRODUCT_MASTER_VALID_ROWS:?set the approved Product Master valid-row count}
      AIRTEK_APPROVED_PRODUCT_MASTER_ERROR_ROWS: ${AIRTEK_APPROVED_PRODUCT_MASTER_ERROR_ROWS:?set the approved Product Master error-row count}
      AIRTEK_ANALYTICS_ALLOWED_UTM_SOURCES: ${AIRTEK_ANALYTICS_ALLOWED_UTM_SOURCES:-}
      AIRTEK_ANALYTICS_ALLOWED_UTM_MEDIUMS: ${AIRTEK_ANALYTICS_ALLOWED_UTM_MEDIUMS:-}
      AIRTEK_ANALYTICS_ALLOWED_UTM_CAMPAIGNS: ${AIRTEK_ANALYTICS_ALLOWED_UTM_CAMPAIGNS:-}
      RUST_LOG: ${RUST_LOG:-airtek_runtime=info,airtek_http=info,airtek_jobs=info}
    depends_on:
      platform-maintenance:
        condition: service_completed_successfully
    mem_limit: 768m
    restart: unless-stopped

  public-web:
    platform: ${AIRTEK_TARGET_PLATFORM:-}
    image: ${AIRTEK_PUBLIC_WEB_IMAGE:?set AIRTEK_PUBLIC_WEB_IMAGE to an immutable image reference}
    environment:
      PUBLIC_API_INTERNAL_URL: http://platform-api:8080/api/public/v1
      PUBLIC_API_BROWSER_ORIGIN: ${AIRTEK_API_ORIGIN:?set AIRTEK_API_ORIGIN}
      PUBLIC_ORIGIN: ${AIRTEK_PUBLIC_ORIGIN:?set AIRTEK_PUBLIC_ORIGIN}
    expose:
      - "3000"
    depends_on:
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  admin-web:
    platform: ${AIRTEK_TARGET_PLATFORM:-}
    image: ${AIRTEK_ADMIN_WEB_IMAGE:?set AIRTEK_ADMIN_WEB_IMAGE to an immutable image reference}
    environment:
      ADMIN_API_ORIGIN: ${AIRTEK_API_ORIGIN:?set AIRTEK_API_ORIGIN}
      ADMIN_MEDIA_IMAGE_SOURCES: "https:"
    expose:
      - "3100"
    depends_on:
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3100/robots.txt && wget -q -O /dev/null http://127.0.0.1:3100/runtime-config.json"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  gateway:
    platform: ${AIRTEK_TARGET_PLATFORM:-}
    image: ${AIRTEK_GATEWAY_IMAGE:?set AIRTEK_GATEWAY_IMAGE to an immutable image reference}
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST}
      ADMIN_HOST: ${ADMIN_HOST:?set ADMIN_HOST}
      API_HOST: ${API_HOST:?set API_HOST}
      API_BROWSER_ORIGIN: ${AIRTEK_API_ORIGIN:?set AIRTEK_API_ORIGIN}
      MEDIA_IMAGE_SOURCES: "https:"
    ports:
      - "${AIRTEK_INGRESS_BIND_ADDRESS:-127.0.0.1}:${AIRTEK_INGRESS_HTTP_PORT:-8088}:8088"
    depends_on:
      public-web:
        condition: service_healthy
      admin-web:
        condition: service_healthy
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8088/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      default:
        ipv4_address: ${AIRTEK_GATEWAY_INTERNAL_IP:-172.29.0.10}
    restart: unless-stopped

  public-readiness:
    platform: ${AIRTEK_TARGET_PLATFORM:-}
    image: ${AIRTEK_PLATFORM_IMAGE:?set AIRTEK_PLATFORM_IMAGE to an immutable image reference}
    entrypoint: ["/usr/local/bin/airtek-maintenance"]
    command: ["check-public-readiness"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      AIRTEK_PUBLIC_ORIGIN: ${AIRTEK_PUBLIC_ORIGIN:?set AIRTEK_PUBLIC_ORIGIN}
      AIRTEK_ADMIN_ORIGIN: ${AIRTEK_ADMIN_ORIGIN:?set AIRTEK_ADMIN_ORIGIN}
      AIRTEK_API_ORIGIN: ${AIRTEK_API_ORIGIN:?set AIRTEK_API_ORIGIN}
      AIRTEK_READINESS_GATEWAY_ORIGIN: http://gateway:8088
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST}
      ADMIN_HOST: ${ADMIN_HOST:?set ADMIN_HOST}
      API_HOST: ${API_HOST:?set API_HOST}
      RUST_LOG: ${RUST_LOG:-airtek_runtime=info,airtek_http=info,airtek_jobs=info}
    depends_on:
      gateway:
        condition: service_healthy
    restart: "no"

networks:
  default:
    external: true
    name: ${AIRTEK_PRODUCTION_NETWORK:-airtek-production}
