name: ${COMPOSE_PROJECT_NAME:-airtekpower}

services:
  postgres:
    image: ${AIRTEK_POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-airtek}
      POSTGRES_USER: ${POSTGRES_USER:-airtek}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airtek}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    profiles: ["minio"]
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: airtek
      MINIO_ROOT_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:${AIRTEK_OBJECT_STORE_HOST_PORT:-19000}:9000"
      - "127.0.0.1:${AIRTEK_OBJECT_STORE_CONSOLE_HOST_PORT:-19001}:9001"
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  minio-create-bucket:
    profiles: ["minio"]
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done
        mc mb --ignore-existing "local/$${AIRTEK_MEDIA_S3_BUCKET}"
        mc anonymous set download "local/$${AIRTEK_MEDIA_S3_BUCKET}"
        render_policy() {
          source="$$1"
          target="$$2"
          while IFS= read -r line; do
            case "$$line" in
              *REPLACE_MEDIA_BUCKET*)
                before="$${line%%REPLACE_MEDIA_BUCKET*}"
                after="$${line#*REPLACE_MEDIA_BUCKET}"
                printf '%s%s%s\n' "$$before" "$${AIRTEK_MEDIA_S3_BUCKET}" "$$after"
                ;;
              *) printf '%s\n' "$$line" ;;
            esac
          done < "$$source" > "$$target"
        }
        render_policy /policies/media-api.json /tmp/media-api.json
        mc admin policy create local airtek-media-api /tmp/media-api.json
        mc admin user add local "$${AIRTEK_MEDIA_API_S3_ACCESS_KEY_ID}" "$${AIRTEK_MEDIA_API_S3_SECRET_ACCESS_KEY}" || \
          mc admin user enable local "$${AIRTEK_MEDIA_API_S3_ACCESS_KEY_ID}"
        mc admin policy attach local airtek-media-api --user "$${AIRTEK_MEDIA_API_S3_ACCESS_KEY_ID}"
    environment:
      MINIO_ROOT_USER: airtek
      MINIO_ROOT_PASSWORD: local-development-only
      AIRTEK_MEDIA_S3_BUCKET: airtek-media
      AIRTEK_MEDIA_API_S3_ACCESS_KEY_ID: airtek-media-api
      AIRTEK_MEDIA_API_S3_SECRET_ACCESS_KEY: local-api-media-only
    volumes:
      - ./infra/object-storage/media-api-policy.json:/policies/media-api.json:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  flyway-migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.flyway
      args:
        FLYWAY_BASE_IMAGE: ${AIRTEK_FLYWAY_BASE_IMAGE:-flyway/flyway:13.4.0-alpine}
    command: ["release"]
    environment:
      FLYWAY_URL: ${FLYWAY_URL:-jdbc:postgresql://postgres:5432/airtek}
      FLYWAY_USER: ${FLYWAY_USER:-airtek}
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:-airtek}
      FLYWAY_PLACEHOLDERS_RUNTIME_ROLE: ${FLYWAY_PLACEHOLDERS_RUNTIME_ROLE:-airtek}
      AIRTEK_FLYWAY_TARGET: ${AIRTEK_FLYWAY_TARGET:-28}
      AIRTEK_RELEASE_TAG: ${AIRTEK_IMAGE_TAG:-local}
      AIRTEK_MIGRATION_STATE_DIR: /var/lib/airtek/migration-state
      # Local compatibility for the existing single-role development volume.
      # The production boundary cannot pass this override.
      AIRTEK_FLYWAY_ALLOW_SHARED_ROLE: "true"
    volumes:
      - migration-state:/var/lib/airtek/migration-state
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  platform-maintenance:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.platform
      args:
        AIRTEK_PLATFORM_FEATURES: ${AIRTEK_PLATFORM_FEATURES:-devtools}
        CARGO_REGISTRY_MIRROR: ${AIRTEK_CARGO_MIRROR:-}
        HTTP_PROXY: ${AIRTEK_BUILD_PROXY:-}
        HTTPS_PROXY: ${AIRTEK_BUILD_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    entrypoint: ["/usr/local/bin/airtek-maintenance"]
    command: ["${AIRTEK_MAINTENANCE_COMMAND:-prepare-development-runtime}"]
    extra_hosts:
      - "media.localhost:host-gateway"
    environment:
      DATABASE_URL: ${AIRTEK_DATABASE_URL_INTERNAL:-postgres://airtek:airtek@postgres:5432/airtek}
      AIRTEK_DEV_ADMIN_SEED: ${AIRTEK_DEV_ADMIN_SEED:-true}
      AIRTEK_DEV_PUBLIC_SEED: ${AIRTEK_DEV_PUBLIC_SEED:-false}
      AIRTEK_DEV_ADMIN_DISPLAY_NAME: AIRTEK Local Administrator
      AIRTEK_DEV_ADMIN_EMAIL: local-admin@airtek.invalid
      AIRTEK_DEV_ADMIN_PASSWORD: Airtek-Local-Admin-20260917!
      AIRTEK_PUBLIC_ORIGIN: ${AIRTEK_COMPOSE_PUBLIC_ORIGIN:-http://www.airtek.localhost:8088}
      AIRTEK_ADMIN_ORIGIN: ${AIRTEK_COMPOSE_ADMIN_ORIGIN:-http://admin.airtek.localhost:8088}
      AIRTEK_API_ORIGIN: ${AIRTEK_COMPOSE_API_ORIGIN:-http://api.airtek.localhost:8088}
      AIRTEK_READINESS_GATEWAY_ORIGIN: http://gateway:8088
      AIRTEK_READINESS_ALLOW_HTTP: "true"
      AIRTEK_READINESS_EXTERNAL: "false"
      PUBLIC_HOST: ${PUBLIC_HOST:-www.airtek.localhost}
      ADMIN_HOST: ${ADMIN_HOST:-admin.airtek.localhost}
      API_HOST: ${API_HOST:-api.airtek.localhost}
      RUST_LOG: ${RUST_LOG:-airtek_runtime=info,airtek_http=info,airtek_jobs=info}
    depends_on:
      flyway-migrate:
        condition: service_completed_successfully
    restart: "no"

  platform-api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.platform
      args:
        AIRTEK_PLATFORM_FEATURES: ${AIRTEK_PLATFORM_FEATURES:-devtools}
        CARGO_REGISTRY_MIRROR: ${AIRTEK_CARGO_MIRROR:-}
        HTTP_PROXY: ${AIRTEK_BUILD_PROXY:-}
        HTTPS_PROXY: ${AIRTEK_BUILD_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    environment:
      AIRTEK_API_HOST: ${AIRTEK_API_HOST:-0.0.0.0}
      DATABASE_URL: ${AIRTEK_DATABASE_URL_INTERNAL:-postgres://airtek:airtek@postgres:5432/airtek}
      AIRTEK_PUBLIC_ORIGIN: ${AIRTEK_COMPOSE_PUBLIC_ORIGIN:-http://www.airtek.localhost:8088}
      AIRTEK_ADMIN_ORIGIN: ${AIRTEK_COMPOSE_ADMIN_ORIGIN:-http://admin.airtek.localhost:8088}
      AIRTEK_DEV_ADMIN_PASSWORD_ONLY: ${AIRTEK_DEV_ADMIN_PASSWORD_ONLY:-true}
      AIRTEK_ADMIN_BOOTSTRAP_TOKEN: ${AIRTEK_ADMIN_BOOTSTRAP_TOKEN:-local-development-bootstrap-change-me}
      AIRTEK_TOTP_ENCRYPTION_KEY: ${AIRTEK_TOTP_ENCRYPTION_KEY:-}
      AIRTEK_PRODUCT_STAGING_ENCRYPTION_KEY: ${AIRTEK_PRODUCT_STAGING_ENCRYPTION_KEY:-}
      AIRTEK_ANALYTICS_TOKEN_HMAC_KEY: ${AIRTEK_ANALYTICS_TOKEN_HMAC_KEY:-}
      AIRTEK_INVITATION_REPLAY_ENCRYPTION_KEY: ${AIRTEK_INVITATION_REPLAY_ENCRYPTION_KEY:-}
      AIRTEK_GUEST_RAW_RETENTION_DAYS: ${AIRTEK_GUEST_RAW_RETENTION_DAYS:-180}
      AIRTEK_GUEST_AGGREGATE_RETENTION_MONTHS: ${AIRTEK_GUEST_AGGREGATE_RETENTION_MONTHS:-24}
      AIRTEK_PRODUCT_IMPORT_MAPPING_VERSION: ${AIRTEK_PRODUCT_IMPORT_MAPPING_VERSION:-airtek-basic-v1}
      AIRTEK_APPROVED_PRODUCT_MASTER_SHA256: ${AIRTEK_APPROVED_PRODUCT_MASTER_SHA256:-}
      AIRTEK_APPROVED_PRODUCT_MASTER_MAPPING_VERSION: ${AIRTEK_APPROVED_PRODUCT_MASTER_MAPPING_VERSION:-}
      AIRTEK_APPROVED_PRODUCT_MASTER_VALID_ROWS: ${AIRTEK_APPROVED_PRODUCT_MASTER_VALID_ROWS:-}
      AIRTEK_APPROVED_PRODUCT_MASTER_ERROR_ROWS: ${AIRTEK_APPROVED_PRODUCT_MASTER_ERROR_ROWS:-}
      AIRTEK_ANALYTICS_ALLOWED_UTM_SOURCES: ${AIRTEK_ANALYTICS_ALLOWED_UTM_SOURCES:-}
      AIRTEK_ANALYTICS_ALLOWED_UTM_MEDIUMS: ${AIRTEK_ANALYTICS_ALLOWED_UTM_MEDIUMS:-}
      AIRTEK_ANALYTICS_ALLOWED_UTM_CAMPAIGNS: ${AIRTEK_ANALYTICS_ALLOWED_UTM_CAMPAIGNS:-}
      # Only this fixed gateway address may supply X-Forwarded-For to the API.
      AIRTEK_TRUSTED_PROXY_CIDRS: ${AIRTEK_TRUSTED_PROXY_CIDRS:-172.28.0.10/32}
      RUST_LOG: ${RUST_LOG:-airtek_runtime=info,airtek_http=info,airtek_jobs=info,tower_http=info}
    ports:
      - "${AIRTEK_BIND_ADDRESS:-127.0.0.1}:${AIRTEK_API_HOST_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "media.localhost:host-gateway"
    depends_on:
      platform-maintenance:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  platform-worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.platform
      args:
        AIRTEK_PLATFORM_FEATURES: ${AIRTEK_PLATFORM_FEATURES:-devtools}
        CARGO_REGISTRY_MIRROR: ${AIRTEK_CARGO_MIRROR:-}
        HTTP_PROXY: ${AIRTEK_BUILD_PROXY:-}
        HTTPS_PROXY: ${AIRTEK_BUILD_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    entrypoint: ["/usr/local/bin/airtek-worker"]
    environment:
      AIRTEK_API_HOST: ${AIRTEK_API_HOST:-0.0.0.0}
      DATABASE_URL: ${AIRTEK_DATABASE_URL_INTERNAL:-postgres://airtek:airtek@postgres:5432/airtek}
      AIRTEK_PUBLIC_ORIGIN: ${AIRTEK_COMPOSE_PUBLIC_ORIGIN:-http://www.airtek.localhost:8088}
      AIRTEK_ADMIN_ORIGIN: ${AIRTEK_COMPOSE_ADMIN_ORIGIN:-http://admin.airtek.localhost:8088}
      AIRTEK_TOTP_ENCRYPTION_KEY: ${AIRTEK_TOTP_ENCRYPTION_KEY:-}
      AIRTEK_PRODUCT_STAGING_ENCRYPTION_KEY: ${AIRTEK_PRODUCT_STAGING_ENCRYPTION_KEY:-}
      AIRTEK_ANALYTICS_TOKEN_HMAC_KEY: ${AIRTEK_ANALYTICS_TOKEN_HMAC_KEY:-}
      AIRTEK_INVITATION_REPLAY_ENCRYPTION_KEY: ${AIRTEK_INVITATION_REPLAY_ENCRYPTION_KEY:-}
      AIRTEK_GUEST_RAW_RETENTION_DAYS: ${AIRTEK_GUEST_RAW_RETENTION_DAYS:-180}
      AIRTEK_GUEST_AGGREGATE_RETENTION_MONTHS: ${AIRTEK_GUEST_AGGREGATE_RETENTION_MONTHS:-24}
      AIRTEK_PRODUCT_IMPORT_MAPPING_VERSION: ${AIRTEK_PRODUCT_IMPORT_MAPPING_VERSION:-airtek-basic-v1}
      AIRTEK_APPROVED_PRODUCT_MASTER_SHA256: ${AIRTEK_APPROVED_PRODUCT_MASTER_SHA256:-}
      AIRTEK_APPROVED_PRODUCT_MASTER_MAPPING_VERSION: ${AIRTEK_APPROVED_PRODUCT_MASTER_MAPPING_VERSION:-}
      AIRTEK_APPROVED_PRODUCT_MASTER_VALID_ROWS: ${AIRTEK_APPROVED_PRODUCT_MASTER_VALID_ROWS:-}
      AIRTEK_APPROVED_PRODUCT_MASTER_ERROR_ROWS: ${AIRTEK_APPROVED_PRODUCT_MASTER_ERROR_ROWS:-}
      AIRTEK_ANALYTICS_ALLOWED_UTM_SOURCES: ${AIRTEK_ANALYTICS_ALLOWED_UTM_SOURCES:-}
      AIRTEK_ANALYTICS_ALLOWED_UTM_MEDIUMS: ${AIRTEK_ANALYTICS_ALLOWED_UTM_MEDIUMS:-}
      AIRTEK_ANALYTICS_ALLOWED_UTM_CAMPAIGNS: ${AIRTEK_ANALYTICS_ALLOWED_UTM_CAMPAIGNS:-}
      RUST_LOG: ${RUST_LOG:-airtek_runtime=info,airtek_http=info,airtek_jobs=info}
    depends_on:
      platform-maintenance:
        condition: service_completed_successfully
    mem_limit: 768m
    restart: unless-stopped

  public-web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        NPM_CONFIG_REGISTRY: ${AIRTEK_NPM_REGISTRY:-https://registry.npmjs.org}
        HTTP_PROXY: ${AIRTEK_BUILD_PROXY:-}
        HTTPS_PROXY: ${AIRTEK_BUILD_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        VITE_PUBLIC_API_BASE_URL: ${AIRTEK_COMPOSE_API_ORIGIN:-http://api.airtek.localhost:8088}/api/public/v1
        VITE_PUBLIC_ORIGIN: ${AIRTEK_COMPOSE_PUBLIC_ORIGIN:-http://www.airtek.localhost:8088}
    environment:
      PUBLIC_API_INTERNAL_URL: ${PUBLIC_API_INTERNAL_URL:-http://platform-api:8080/api/public/v1}
      PUBLIC_API_BROWSER_ORIGIN: ${AIRTEK_COMPOSE_API_ORIGIN:-http://api.airtek.localhost:8088}
      PUBLIC_MEDIA_ORIGIN: ${AIRTEK_COMPOSE_MEDIA_ORIGIN:-http://media.localhost:19000}
      PUBLIC_ORIGIN: ${AIRTEK_COMPOSE_PUBLIC_ORIGIN:-http://www.airtek.localhost:8088}
    ports:
      - "${AIRTEK_BIND_ADDRESS:-127.0.0.1}:${AIRTEK_PUBLIC_HOST_PORT:-3000}:3000"
    depends_on:
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  admin-web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.admin
      args:
        NPM_CONFIG_REGISTRY: ${AIRTEK_NPM_REGISTRY:-https://registry.npmjs.org}
        HTTP_PROXY: ${AIRTEK_BUILD_PROXY:-}
        HTTPS_PROXY: ${AIRTEK_BUILD_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        VITE_ADMIN_API_BASE_URL: ${AIRTEK_COMPOSE_API_ORIGIN:-http://api.airtek.localhost:8088}/api/admin/v1
    environment:
      ADMIN_API_ORIGIN: ${AIRTEK_COMPOSE_API_ORIGIN:-http://api.airtek.localhost:8088}
      ADMIN_MEDIA_IMAGE_SOURCES: "https: ${AIRTEK_COMPOSE_MEDIA_ORIGIN:-http://media.localhost:19000} http://localhost:${AIRTEK_OBJECT_STORE_HOST_PORT:-19000}"
    ports:
      - "${AIRTEK_BIND_ADDRESS:-127.0.0.1}:${AIRTEK_ADMIN_HOST_PORT:-3100}:3100"
    depends_on:
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3100/robots.txt"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gateway
    environment:
      PUBLIC_LEGACY_HOST: www.localhost
      PUBLIC_REDIRECT_ORIGIN: ${AIRTEK_COMPOSE_PUBLIC_ORIGIN:-http://www.airtek.localhost:8088}
      PUBLIC_HOST: ${PUBLIC_HOST:-www.airtek.localhost}
      ADMIN_HOST: ${ADMIN_HOST:-admin.airtek.localhost}
      API_HOST: ${API_HOST:-api.airtek.localhost}
      API_BROWSER_ORIGIN: ${AIRTEK_COMPOSE_API_ORIGIN:-http://api.airtek.localhost:8088}
      MEDIA_IMAGE_SOURCES: "https: ${AIRTEK_COMPOSE_MEDIA_ORIGIN:-http://media.localhost:19000} http://localhost:${AIRTEK_OBJECT_STORE_HOST_PORT:-19000}"
    ports:
      - "${AIRTEK_BIND_ADDRESS:-127.0.0.1}:${AIRTEK_GATEWAY_HOST_PORT:-8088}:8088"
    depends_on:
      public-web:
        condition: service_healthy
      admin-web:
        condition: service_healthy
      platform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8088/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      default:
        ipv4_address: ${AIRTEK_GATEWAY_INTERNAL_IP:-172.28.0.10}
    restart: unless-stopped

volumes:
  postgres-data:
  object-data:
  migration-state:

networks:
  default:
    ipam:
      config:
        - subnet: ${AIRTEK_COMPOSE_SUBNET:-172.28.0.0/24}
